<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">

  <defs>
    <!-- Dark cinematic background -->
    <radialGradient id="bg">
      <stop offset="0%" stop-color="#1a0030"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>

    <!-- Neon glow -->
    <linearGradient id="neon">
      <stop offset="0%" stop-color="#00f7ff"/>
      <stop offset="50%" stop-color="#ff00ff"/>
      <stop offset="100%" stop-color="#00ff88"/>
    </linearGradient>

    <!-- Chrome -->
    <linearGradient id="chrome">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#9e9e9e"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>

    <!-- Strong glow -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Glitch effect -->
    <filter id="glitch">
      <feOffset dx="2" dy="0" result="r"/>
      <feOffset dx="-2" dy="0" in="SourceGraphic" result="g"/>
      <feMerge>
        <feMergeNode in="r"/>
        <feMergeNode in="g"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>

  <!-- Flash burst -->
  <circle cx="256" cy="256" r="0" fill="#00f7ff" opacity="0.3">
    <animate attributeName="r" values="0;250;0" dur="1.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0;0.6" dur="1.8s" repeatCount="indefinite"/>
  </circle>

  <!-- Rotating neon ring -->
  <circle cx="256" cy="256" r="170"
          fill="none"
          stroke="url(#neon)"
          stroke-width="6"
          opacity="0.6"
          filter="url(#glow)">
    <animateTransform attributeName="transform"
      type="rotate"
      from="0 256 256"
      to="360 256 256"
      dur="6s"
      repeatCount="indefinite"/>
  </circle>

  <!-- Glitch shadow -->
  <text x="50%" y="55%" text-anchor="middle"
        font-size="135"
        font-family="Arial Black"
        fill="#000"
        opacity="0.4"
        transform="translate(8,10)">
    ITS
  </text>

  <!-- Neon outline glitch -->
  <text x="50%" y="55%" text-anchor="middle"
        font-size="135"
        font-family="Arial Black"
        fill="none"
        stroke="url(#neon)"
        stroke-width="7"
        filter="url(#glow)">
    ITS
    <animate attributeName="stroke-width" values="5;10;5" dur="1.5s" repeatCount="indefinite"/>
  </text>

  <!-- Main chrome text -->
  <text x="50%" y="55%" text-anchor="middle"
        font-size="135"
        font-family="Arial Black"
        fill="url(#chrome)"
        filter="url(#glitch)">
    ITS
    <animate attributeName="opacity" values="0.7;1;0.7" dur="1.2s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform"
      type="scale"
      values="0.95;1.05;0.95"
      dur="1.2s"
      repeatCount="indefinite"/>
  </text>

</svg>
