<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ITS Love Family DX</title>

<link rel="manifest" href="manifest.json">

<style>
body{
margin:0;
font-family:Arial;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
overflow:hidden;
background:linear-gradient(-45deg,#ff4d6d,#ff85a1,#ff5c8a,#ff99ac);
background-size:400% 400%;
animation:bgmove 8s ease infinite;
}

@keyframes bgmove{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

/* Splash */
#splash{
position:fixed;
width:100%;
height:100%;
background:#ff2e63;
display:flex;
justify-content:center;
align-items:center;
color:white;
font-size:28px;
z-index:999;
animation:fadeOut 2s forwards 2s;
}

@keyframes fadeOut{
to{opacity:0;visibility:hidden;}
}

/* Moving text */
body::before{
content:"💖 ᎪᏚᏚᎪᏞᎪᎷᏌ ᎪᏞᎪᏆᏦᏌᎷ 💕 ᏔᎬᏞᏟᎾᎷᎬ Ͳϴ ᏆͲՏ ᏞϴᏙᎬ ҒᎪᎷᏆᏞᎽ 💗";
position:absolute;
top:10px;
left:100%;
white-space:nowrap;
color:#fff;
animation:moveLeft 10s linear infinite;
}

@keyframes moveLeft{
0%{left:100%;}
100%{left:-100%;}
}

.box{
background:rgba(255,255,255,0.2);
padding:25px;
border-radius:20px;
text-align:center;
}

input{
padding:10px;
border:none;
border-radius:10px;
}

button{
padding:10px;
margin:5px;
border:none;
border-radius:10px;
background:#ff2e63;
color:#fff;
}

.result{
margin-top:10px;
color:white;
font-size:22px;
}

/* Install Button */
#installBtn{
position:fixed;
top:50px;
right:10px;
background:#00ffcc;
padding:10px;
border-radius:10px;
display:none;
}
</style>
</head>

<body>

<div id="splash">💖 ITS APP 💖</div>

<button id="installBtn">Install</button>

<div class="box">
<h2>ᏆͲՏ ᏞϴᏀϴ ᎷᎪᏦᎬᎡ 💖</h2>

<input type="text" id="name" placeholder="Enter Your Name">
<br>

<button onclick="makeName()">Create</button>
<button onclick="copyText()">Copy</button>

<div id="output" class="result">Your Logo Name</div>

<p style="color:#00ffcc;margin-top:10px;">👑 App Creator By (ɪᴛs xᴀᴛᴋᴀ)</p>

</div>

<script>

// LOGO FUNCTION
function makeName(){

let name=document.getElementById("name").value.trim();

if(name===""){
document.getElementById("output").innerText="Enter Name First";
return;
}

let prefix="ᶦƬˢ⃝🎀";
let suffix="﷽";

let smallCaps={
A:'ᴀ',B:'ʙ',C:'ᴄ',D:'ᴅ',E:'ᴇ',F:'ғ',G:'ɢ',
H:'ʜ',I:'ɪ',J:'ᴊ',K:'ᴋ',L:'ʟ',M:'ᴍ',N:'ɴ',
O:'ᴏ',P:'ᴘ',Q:'ǫ',R:'ʀ',S:'s',T:'ᴛ',U:'ᴜ',
V:'ᴠ',W:'ᴡ',X:'x',Y:'ʏ',Z:'ᴢ'
};

let first=name.charAt(0).toUpperCase();
let code=first.charCodeAt(0);

let regional="";
if(code>=65 && code<=90){
regional=String.fromCodePoint(0x1F1E6+(code-65));
}else{
regional=first;
}

let rest=name.slice(1);
let styled="";

for(let i=0;i<rest.length;i++){
let ch=rest[i].toUpperCase();
styled += smallCaps[ch] || rest[i];
}

document.getElementById("output").innerText =
prefix + regional + styled + suffix;
}

// COPY
function copyText(){
let text=document.getElementById("output").innerText;
navigator.clipboard.writeText(text);
alert("Copied Successfully!");
}

// INSTALL SYSTEM
let deferredPrompt;
window.addEventListener("beforeinstallprompt",(e)=>{
e.preventDefault();
deferredPrompt=e;
document.getElementById("installBtn").style.display="block";
});

document.getElementById("installBtn").onclick=()=>{
deferredPrompt.prompt();
};

// SERVICE WORKER
if("serviceWorker" in navigator){
navigator.serviceWorker.register("sw.js");
}

</script>

</body>
</html>
