<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ITS Love Family DX</title><link rel="manifest" href="manifest.json"><style>
body{
margin:0;
font-family:Arial;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
overflow:hidden;
background:linear-gradient(-45deg,#ff4d6d,#ff85a1,#ff5c8a,#ff99ac);
background-size:400% 400%;
animation:bgmove 8s ease infinite;
}

@keyframes bgmove{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

/* Splash */
#splash{
position:fixed;
width:100%;
height:100%;
background:#ff2e63;
display:flex;
justify-content:center;
align-items:center;
color:white;
font-size:28px;
z-index:999;
animation:fadeOut 2s forwards 2s;
}

@keyframes fadeOut{
to{opacity:0;visibility:hidden;}
}

/* Moving text */
body::before{
content:"💖 ᎪᏚᏚᎪᏞᎪᎷᏌ ᎪᏞᎪᏆᏦᏌᎷ 💕 ᏔᎬᏞᏟᎾᎷᎬ 💗";
position:absolute;
top:10px;
left:100%;
white-space:nowrap;
color:#fff;
animation:moveLeft 10s linear infinite;
}

@keyframes moveLeft{
0%{left:100%;}
100%{left:-100%;}
}

.box{
background:rgba(255,255,255,0.2);
padding:25px;
border-radius:20px;
text-align:center;
}

input{
padding:10px;
border:none;
border-radius:10px;
}

button{
padding:10px;
margin:5px;
border:none;
border-radius:10px;
background:#ff2e63;
color:#fff;
}

.result{
margin-top:10px;
color:white;
font-size:22px;
}

/* Install Button */
#installBtn{
position:fixed;
top:50px;
right:10px;
background:#00ffcc;
padding:10px;
border-radius:10px;
display:none;
}

/* WhatsApp floating */
.wa-float{
position:fixed;
bottom:80px;
right:20px;
background:#25D366;
color:#fff;
font-size:26px;
padding:14px;
border-radius:50%;
text-decoration:none;
box-shadow:0 0 15px #25D366;
animation:pulse 1.5s infinite;
}

@keyframes pulse{
0%{transform:scale(1);}
50%{transform:scale(1.2);}
100%{transform:scale(1);}
}

/* Contact button */
.contact-btn{
position:fixed;
bottom:150px;
right:20px;
background:#ff2e63;
color:white;
padding:10px;
border:none;
border-radius:10px;
}

/* Popup */
.popup{
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.6);
justify-content:center;
align-items:center;
}

.popup-box{
background:white;
padding:20px;
border-radius:15px;
text-align:center;
}

.popup-box a{
background:#25D366;
color:white;
padding:10px;
border-radius:10px;
text-decoration:none;
}
</style></head><body><div id="splash">💖 ᴢᴇɴ⃝✨ Logo Website 💖</div><button id="installBtn">Install</button>

<div class="box">
<h2>ᴢᴇɴ⃝✨ ᏞϴᏀϴ ᎷᎪᏦᎬᎡ 💖</h2><input type="text" id="name" placeholder="Enter Your Name">
<br><button onclick="makeName()">Create</button>
<button onclick="copyText()">Copy</button>

<div id="output" class="result">Your Stylish Name</div><p style="color:#00ffcc;margin-top:10px;">👑 App Creator By (ХᎪͲᏦᎪ)</p>
</div><!-- WhatsApp Auto Message --><a href="https://wa.me/8801870339767?text=Hello%20I%20am%20interested%20in%20your%20ITS%20Logo%20Maker%20App%20💖" target="_blank" class="wa-float">💬</a>

<!-- Contact Popup --><button class="contact-btn" onclick="openPopup()">Contact</button>

<div id="popup" class="popup">
<div class="popup-box">
<h3>Contact Developer 💖</h3>
<p>Chat on WhatsApp</p>
<a href="https://wa.me/8801870339767?text=Hi%20I%20need%20help%20🔥" target="_blank">Open WhatsApp</a>
<br><br>
<button onclick="closePopup()">Close</button>
</div>
</div><script>

// LOGO FUNCTION
function makeName(){
let name=document.getElementById("name").value.trim();

if(name===""){
document.getElementById("output").innerText="Enter Name First";
return;
}

let prefix="ᴢᴇɴ⃝✨";
let suffix="﷽";

let smallCaps={
A:'ᴀ',B:'ʙ',C:'ᴄ',D:'ᴅ',E:'ᴇ',F:'ғ',G:'ɢ',
H:'ʜ',I:'ɪ',J:'ᴊ',K:'ᴋ',L:'ʟ',M:'ᴍ',N:'ɴ',
O:'ᴏ',P:'ᴘ',Q:'ǫ',R:'ʀ',S:'s',T:'ᴛ',U:'ᴜ',
V:'ᴠ',W:'ᴡ',X:'x',Y:'ʏ',Z:'ᴢ'
};

let first=name.charAt(0).toUpperCase();
let code=first.charCodeAt(0);

let regional="";
if(code>=65 && code<=90){
regional=String.fromCodePoint(0x1F1E6+(code-65));
}else{
regional=first;
}

let rest=name.slice(1);
let styled="";

for(let i=0;i<rest.length;i++){
let ch=rest[i].toUpperCase();
styled += smallCaps[ch] || rest[i];
}

document.getElementById("output").innerText =
prefix + regional + styled + suffix;
}

// COPY
function copyText(){
let text=document.getElementById("output").innerText;
navigator.clipboard.writeText(text);
alert("Copied Successfully!");
}

// INSTALL
let deferredPrompt;
window.addEventListener("beforeinstallprompt",(e)=>{
e.preventDefault();
deferredPrompt=e;
document.getElementById("installBtn").style.display="block";
});
document.getElementById("installBtn").onclick=()=>{
deferredPrompt.prompt();
};

// POPUP
function openPopup(){
document.getElementById("popup").style.display="flex";
}
function closePopup(){
document.getElementById("popup").style.display="none";
}

// SERVICE WORKER
if("serviceWorker" in navigator){
navigator.serviceWorker.register("sw.js");
}

</script></body>
</html>
