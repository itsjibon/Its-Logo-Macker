
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ITS Love Family DX</title>

<link rel="manifest" href="manifest.json">

<style>
body{
margin:0;
font-family:Arial;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
overflow:hidden;
background:linear-gradient(-45deg,#ff4d6d,#ff85a1,#ff5c8a,#ff99ac);
background-size:400% 400%;
animation:bgmove 8s ease infinite;
}

@keyframes bgmove{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

/* Splash Screen */
#splash{
position:fixed;
width:100%;
height:100%;
background:#ff2e63;
display:flex;
justify-content:center;
align-items:center;
color:white;
font-size:28px;
z-index:999;
animation:fadeOut 2s forwards 2s;
}

@keyframes fadeOut{
to{opacity:0;visibility:hidden;}
}

/* Moving Text */
body::before{
content:"💖 Welcome To ITS Love Family 💕";
position:absolute;
top:10px;
left:100%;
white-space:nowrap;
color:#fff;
animation:moveLeft 10s linear infinite;
}

@keyframes moveLeft{
0%{left:100%;}
100%{left:-100%;}
}

.box{
background:rgba(255,255,255,0.2);
padding:25px;
border-radius:20px;
text-align:center;
}

input{
padding:10px;
border:none;
border-radius:10px;
}

button{
padding:10px;
margin:5px;
border:none;
border-radius:10px;
background:#ff2e63;
color:#fff;
}

.result{
margin-top:10px;
color:white;
}

/* Install Button */
#installBtn{
position:fixed;
top:50px;
right:10px;
background:#00ffcc;
padding:10px;
border-radius:10px;
display:none;
}
</style>
</head>

<body>

<div id="splash">💖 ITS APP 💖</div>

<button id="installBtn">Install</button>

<div class="box">
<h2>ITS LOGO MAKER 💖</h2>

<input type="text" id="name" placeholder="Enter Name">

<br>

<button onclick="makeName()">Create</button>
<button onclick="copyText()">Copy</button>

<div id="output" class="result"></div>

</div>

<script>
function makeName(){
let name=document.getElementById("name").value;
document.getElementById("output").innerText="💖 "+name+" 💖";
}

function copyText(){
let text=document.getElementById("output").innerText;
navigator.clipboard.writeText(text);
alert("Copied!");
}

// install system
let deferredPrompt;
window.addEventListener("beforeinstallprompt",(e)=>{
e.preventDefault();
deferredPrompt=e;
document.getElementById("installBtn").style.display="block";
});

document.getElementById("installBtn").onclick=()=>{
deferredPrompt.prompt();
};

// service worker
if("serviceWorker" in navigator){
navigator.serviceWorker.register("sw.js");
}
</script>

</body>
</html>
